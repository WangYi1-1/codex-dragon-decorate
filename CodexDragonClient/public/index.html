<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex · 龙娘工坊</title><link rel="stylesheet" href="skin.css"><link rel="stylesheet" href="client.css"><script src="app.js" defer></script></head>
<body>
<svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<linearGradient id="bow-satin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0ff"/><stop offset=".28" stop-color="#d4bcec"/><stop offset=".7" stop-color="#9873bf"/><stop offset="1" stop-color="#e4cefb"/></linearGradient><linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7d8ff"/><stop offset=".38" stop-color="#a77cdf"/><stop offset="1" stop-color="#67478d"/></linearGradient>
<symbol id="bow" viewBox="0 0 150 80"><path d="M69 35C46 19 19 3 12 12L7 61Q25 68 67 46M81 35C104 19 131 3 138 12L143 61Q125 68 83 46" fill="url(#bow-satin)" stroke="#b79662" stroke-width="1.5"/><path d="M18 17Q41 30 64 39M18 55Q38 48 65 43M132 17Q110 30 86 39M132 55Q112 48 85 43" fill="none" stroke="#faf3ff" opacity=".7"/><path d="m67 43-19 30 23-7 7 11 6-31 17 28 6-13 20 4-39-23" fill="url(#bow-satin)" stroke="#b79662"/><path d="m75 21 15 20-15 20-15-20z" fill="#fff8e6" stroke="#b79662" stroke-width="1.5"/><path d="m75 27 10 14-10 14-10-14z" fill="url(#gem)"/><path d="m71 36 4-8 4 8-4 3z" fill="#f7eeff" opacity=".85"/></symbol>
<symbol id="fleur" viewBox="0 0 100 50"><path d="M50 45V4M50 10C40-1 25 11 39 23L50 31M50 10C60-1 75 11 61 23L50 31M46 37C27 18 8 23 14 34C22 45 33 29 46 37M54 37C73 18 92 23 86 34C78 45 67 29 54 37M5 39H42M58 39H95" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m50 32 5 6-5 6-5-6z" fill="currentColor"/></symbol>
</defs></svg>
<div class="connection-strip"><span class="connection-dot" id="connection-dot"></span><span id="connection-label">正在连接 Codex…</span><button id="reconnect" type="button">重新连接</button></div>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><span class="brand-seal">✧</span><div><strong>Codex</strong><span>DRAGON ATELIER</span></div></div>
<button class="new-chat" id="new-chat" type="button"><span>＋</span> 新的会话 <span>✧</span></button>
<nav class="main-nav" aria-label="导航"><button id="workspace-open">▱ <span>工作空间</span></button><button id="appearance-open">◇ <span>外观与宠物</span></button><button id="refresh-chats">↻ <span>刷新会话</span></button></nav>
<div class="workspace-label" id="workspace-label" title="工作目录"></div><div class="sidebar-divider"><span>会话</span><svg><use href="#fleur"/></svg></div>
<input class="chat-search" id="chat-search" type="search" placeholder="搜索全部会话名称…" aria-label="搜索全部本地会话名称" aria-describedby="history-status">
<p class="history-status" id="history-status" role="status" aria-live="polite">本机 Codex 历史会话。</p>
<div class="chat-list" id="chat-list"></div><button id="load-more" class="load-more" hidden>展开更多会话</button>
<div class="sidebar-bottom"><div class="pet-badge">✧</div><div><strong id="account-label">龙娘工坊</strong><span id="account-plan">让灵感慢慢生长</span></div><button id="settings-open" aria-label="设置">⚙</button></div></aside>
<main class="main-pane"><div class="wallpaper" aria-hidden="true"></div><header class="topbar"><div><span class="small-star">✧</span><span id="chat-title">新的会话</span><small id="task-status">准备好听你的想法</small></div><div class="top-actions"><button aria-label="切换侧栏" id="toggle-sidebar">◫</button><button aria-label="切换深浅色" id="toggle-theme">◐</button><button aria-label="归档当前会话" id="archive-chat">⋯</button></div></header><div class="top-lace" aria-hidden="true"><svg class="top-bow"><use href="#bow"/></svg></div>
<div class="history-toolbar" id="history-toolbar" hidden><button id="load-earlier" type="button" hidden>加载更早消息</button><span id="history-message-status" role="status" aria-live="polite"></span></div>
<section class="conversation" id="conversation" aria-label="聊天内容"><div class="welcome" id="welcome"><span class="welcome-star">✧</span><h1>把灵感，交给龙娘。</h1><p>写点什么，或从左侧继续已有的 Codex 会话。</p><div class="starter-actions"><button data-prompt="帮我整理这个项目，先看看目录结构。">梳理一个项目</button><button data-prompt="陪我一起推敲一个想法。">推敲一个想法</button><button data-prompt="帮我修改一段文字，我稍后把内容发给你。">打磨一段文字</button></div></div></section>
<div class="composer-wrap" id="composer-dropzone"><div class="attachment-list" id="attachment-list"></div><form class="composer" id="composer"><div class="composer-lace" aria-hidden="true"></div><svg class="composer-bow" aria-hidden="true"><use href="#bow"/></svg><textarea id="prompt" aria-label="输入想法" title="可拖入文件，或用 Ctrl+V 粘贴截图和文件" placeholder="把你的想法写在这里，让龙娘陪你一起完成…" rows="2"></textarea><div class="composer-footer"><div class="composer-tools"><button type="button" id="add-file" aria-label="添加文件或图片" title="添加文件或图片，也可拖入或粘贴到输入框">＋</button><button type="button" id="choose-directory" aria-label="选择工作目录">▱</button></div><div class="model-controls"><select id="model" aria-label="模型"><option value="">Codex 默认模型</option></select><select id="effort" aria-label="思考深度"><option value="">默认深度</option></select></div><button class="send" id="send" type="submit" aria-label="发送">↑</button><button class="stop-turn" id="stop-turn" type="button" hidden aria-label="停止当前回复">■</button></div></form><p class="composer-caption" id="composer-caption">愿每个小小的灵感，都有属于自己的翅膀。</p></div>
<div class="pet-container" id="pet-container" hidden><div class="pet-sprite" id="pet-sprite" role="img" aria-label="龙娘宠物，鼠标停留时会挥手" title="停留一会儿，龙娘会和你打招呼"></div></div><div class="bottom-ornament" aria-hidden="true"><svg><use href="#fleur"/></svg></div></main></div>
<input type="file" id="image-input" multiple hidden>
<dialog id="settings-dialog"><form method="dialog"><div class="dialog-heading"><h2>龙娘工坊</h2><button value="cancel" aria-label="关闭设置">×</button></div></form><label>工作目录<input id="cwd" placeholder="填写已有的完整目录，例如 C:\Projects"></label><p class="setting-hint">新会话使用这个目录，已有会话沿用原来的工作目录。</p><div class="setting-row"><label for="dark-setting">紫色夜间样式</label><input id="dark-setting" type="checkbox"></div><div class="setting-row"><label for="wallpaper-setting">显示龙娘背景</label><input id="wallpaper-setting" type="checkbox"></div><div class="setting-row"><label for="pet-setting">显示龙娘宠物</label><input id="pet-setting" type="checkbox"></div><label>背景浓淡<input id="wallpaper-opacity" type="range" min="0" max="65" value="40"></label><button class="dialog-primary" id="save-settings" type="button">保存设置</button><p class="setting-hint" id="pet-setting-note">宠物动作制作完成后会在这里显示。</p></dialog>
<dialog id="request-dialog"><h2 id="request-title">需要你的决定</h2><div id="request-description"></div><div id="request-fields"></div><div id="request-actions"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
